{{ define "main" }}
<section class="page-header">
  <div class="wrap">
    <h1>All festivals</h1>
    <p class="muted">{{ len .Pages }} entries currently on the site.</p>
  </div>
</section>
<section class="wrap">
  {{ partial "pill-filters.html" . }}
</section>
<section class="wrap">
  <div class="card-grid" id="card-grid">
    {{ range .Pages.ByTitle }}
      {{ partial "card.html" . }}
    {{ end }}
  </div>
  <p id="no-results" class="muted" hidden>No festivals match the current filters.</p>
</section>
{{ end }}
