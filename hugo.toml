baseURL = "https://adyatithi.github.io/"
locale = "en-us"
title = "Adyatithi"
enableRobotsTXT = true
pygmentsUseClasses = true
removePathAccents = true

[params]
  tagline = "A living almanac of Hindu festivals, vratas & observances"
  sanskritTitle = "अद्यतिथि"
  sourceRepo = "https://github.com/jyotisham/adyatithi"

[taxonomies]
  tag = "tags"
  devata = "devata"
  tradition = "tradition"
  month = "month"
  rashi = "rashi"
  tithi = "tithi"
  nakshatra = "nakshatra"
  category = "category"
  source = "sources"

[permalinks]
  [permalinks.taxonomy]
    month = "/month/lunar/"
    rashi = "/month/solar/"
  [permalinks.term]
    month = "/month/lunar/:slug/"
    rashi = "/month/solar/:slug/"

[outputs]
  home = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML = true
